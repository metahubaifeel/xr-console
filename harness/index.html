<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XR Harness · 视觉执行监控</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10141d;color:#e4e9f4;font:15px system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:30px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:25px}h2{font-size:17px}.tag{color:#69dbb9;border:1px solid #385b57;border-radius:20px;padding:6px 12px}.note{color:#9daac1;line-height:1.8}.panel{background:#19212e;border:1px solid #303c50;border-radius:14px;padding:20px;margin:16px 0}.steps{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.step{padding:12px 8px;background:#232e40;border-radius:8px;line-height:1.7}.step.active{outline:2px solid #69dbb9}.step.done{color:#69dbb9}.cams{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.cams img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#111722;border-radius:8px}button,input,select{border-radius:8px;padding:11px 14px;border:1px solid #455674;color:inherit;background:#253248;font:inherit}button{cursor:pointer;margin:4px}button.primary{background:#146956}button.stop{background:#71383e}button:disabled{opacity:.4;cursor:default}input{max-width:220px}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:6px}pre{white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto;font-size:13px;color:#b6c8e1}#error{color:#ffb0a6;min-height:24px}#status{font-size:20px}label{color:#9daac1} @media(max-width:760px){main{padding:14px}.steps{grid-template-columns:repeat(2,1fr)}.cams{grid-template-columns:1fr}header{display:block}}
</style>
<main><header><h1>XR · 视觉执行监控</h1><span class="tag" id="mode">读取配置…</span></header><p class="note" id="intro"></p>
<div class="panel"><div class="steps" id="steps"></div></div>
<div class="panel"><h2>单步测试</h2><div class="controls"><select id="testStep" aria-label="测试步骤"><option value="1">Step1 抓取扫码枪</option><option value="2">Step2 调整姿态</option><option value="3">Step3 抓瓶并朝向标签</option><option value="4">Step4 对准并读码</option><option value="5">Step5 码值映射</option><option value="6">Step6 放置瓶子</option><option value="7">Step7 归位与复位</option></select><select id="testTarget" aria-label="放置目标"><option value="red">红色框</option><option value="white">白色框</option><option value="silver">银色框</option><option value="black">黑色框</option></select><button class="primary" id="testStart">执行所选步骤</button><button id="step3Left">Step3：锁右手、左手抓瓶</button><button id="checkOnly">仅检测当前画面</button><button id="reference">记录初始位姿</button></div><p class="note">执行期间每隔2.5秒自动检测。单步测试成功后停止，不执行下一步。Step4收到扫码消息后结束；Step5只验证映射。Step3、4、6执行前先识别持物手臂。</p></div>
<div class="panel"><div id="status">就绪</div><p id="detail" class="note"></p><div class="controls"><button id="start">执行完整流程</button><button class="primary" id="observe">结束执行并检测</button><button id="retry">重新执行当前步骤</button><button class="stop" id="stop">停止执行</button></div><p class="note"><a href="/api/hold" target="_blank" style="color:#69dbb9">查看动作锁定快照 JSON</a></p><div id="error" role="status"></div></div>
<div class="cams" id="liveCameras"></div>
<div class="panel"><h2>扫码事件</h2><p class="note">第 4 步等待本轮扫码结果，收到后自动进入放置步骤。OUTA → 红，OUTB → 白，OUTC → 银；ERR99、未知码 → 黑。单步测试收到码值后停止；完整流程进入放置步骤。</p><div class="controls"><input id="code" placeholder="扫码枪返回的码值" maxlength="128"><button id="scan">提交码值</button></div><p id="target"></p></div>
<div class="panel"><h2>VLM 返回 JSON</h2><p id="responseInfo" class="note"></p><pre id="judgment">尚未判断</pre></div><div class="panel"><h2>最新发送给VLA的提示词</h2><pre id="vlaInstruction">尚未下发</pre></div><div class="panel"><h2>持物预检 JSON</h2><pre id="preflight">尚未预检</pre></div><div class="panel"><h2>执行事件</h2><pre id="events"></pre></div>
<script src="/app.js"></script></main></html>
